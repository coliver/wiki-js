services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: wikijs
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki -d wikijs"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  wiki:
    image: requarks/wiki:2
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wiki
      DB_PASS: ${DB_PASS}
      DB_NAME: wikijs
      TZ: UTC
    volumes:
      - wiki_data:/wiki
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - wiki
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - letsencrypt:/etc/letsencrypt
      - ./letsencrypt/www:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./letsencrypt/www:/var/www/certbot
    entrypoint: ["sh", "-c"]
    command: >
      certbot certonly --webroot -w /var/www/certbot
      --preferred-challenges http
      -d murderhobos.wiki
      --email ${EMAIL}
      --agree-tos --non-interactive --no-eff-email --verbose
      && while true; do
        certbot renew --webroot -w /var/www/certbot --preferred-challenges http --quiet
        ; sleep 43200;
      done
    restart: unless-stopped

volumes:
  wiki_data:
  postgres_data:
  letsencrypt:
