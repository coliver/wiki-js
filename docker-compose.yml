services:
  wiki:
    image: requarks/wiki:2
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wiki
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: wikijs
      TZ: UTC
    volumes:
      - wiki_data:/wiki
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wikijs
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  wiki_data:
  postgres_data:
